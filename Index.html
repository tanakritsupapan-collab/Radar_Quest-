<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Radar Quest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&family=Mitr:wght@400;500&family=Noto+Sans+Thai:wght@500;600;700&family=Nunito:wght@500;600;700&display=swap" rel="stylesheet">
<style>

:root{
  --bg:#EEF4FF;--ink:#1D2550;--muted:#5E6894;--card:#FFFFFF;--line:#DCE4F7;
  --navy:#24306E;--navy2:#3A49A0;--mint:#2FC9A6;--mint-soft:#D7F6EE;
  --sun:#FFC23D;--sun-soft:#FFF1CC;--pink:#FF8FA8;--danger:#EF5360;--danger-soft:#FFE1E3;--blue-soft:#DDE3FF;
  --display:"Fredoka","Mitr",system-ui,sans-serif;--body:"Nunito","Noto Sans Thai",system-ui,sans-serif;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121838;--ink:#EEF1FF;--muted:#A3ACD9;--card:#1C2450;--line:#2E3874;--navy:#0C1130;--navy2:#5D6BC4;--mint-soft:#163F45;--sun-soft:#3B3220;--danger-soft:#4A2030;--blue-soft:#262F66}}
:root[data-theme="dark"]{--bg:#121838;--ink:#EEF1FF;--muted:#A3ACD9;--card:#1C2450;--line:#2E3874;--navy:#0C1130;--navy2:#5D6BC4;--mint-soft:#163F45;--sun-soft:#3B3220;--danger-soft:#4A2030;--blue-soft:#262F66}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible,textarea:focus-visible,label:focus-within{outline:3px solid var(--sun);outline-offset:2px}
h1,h2,h3{font-family:var(--display);font-weight:500;margin:0;line-height:1.2}
svg.i{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round}
.app{max-width:520px;margin:0 auto;min-height:100vh;padding-bottom:110px}

/* header + runway XP */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--navy);color:#fff;padding:14px 16px 14px;border-radius:0 0 26px 26px}
.top-row{display:flex;align-items:center;gap:12px}
.avatar{width:46px;height:46px;border-radius:50%;background:var(--sun);color:#24306E;font-family:var(--display);font-weight:600;font-size:17px;display:grid;place-items:center;box-shadow:0 0 0 3px rgba(255,255,255,.18)}
.who{flex:1;min-width:0}
.who .name{font-family:var(--display);font-size:18px;display:flex;align-items:center;gap:6px;min-width:0}
.who .name .lv{flex:none}
.who .ttl{font-size:13px;opacity:.75}
.lv{background:var(--mint);color:#0F2A3A;font-size:12px;padding:0 8px;border-radius:999px;font-family:var(--body);font-weight:700}
.pts{display:flex;align-items:center;gap:5px;font-family:var(--display);font-size:18px;background:rgba(255,255,255,.12);padding:6px 12px;border-radius:999px}
.pts svg{color:var(--sun);fill:var(--sun)}
.help{width:40px;height:40px;border-radius:50%;background:var(--pink);color:#24306E;display:grid;place-items:center}
.runway{margin-top:14px;position:relative}
.track{height:20px;border-radius:999px;background:#3A4790;position:relative;overflow:hidden}
.track::after{content:"";position:absolute;left:10px;right:10px;top:50%;height:3px;transform:translateY(-50%);background:repeating-linear-gradient(90deg,#FFC23D 0 14px,transparent 14px 26px);opacity:.75}
.fill{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,#2FC9A6,#5FE3C4);border-radius:999px;transition:width .8s cubic-bezier(.3,1.4,.5,1)}
.plane{position:absolute;top:50%;transform:translate(-60%,-50%) rotate(45deg);transition:left .8s cubic-bezier(.3,1.4,.5,1);color:#fff;filter:drop-shadow(0 2px 0 rgba(0,0,0,.3))}
.plane svg{width:24px;height:24px;fill:#fff;stroke:#24306E;stroke-width:1.2}
.runway-cap{display:flex;justify-content:space-between;font-size:12px;opacity:.8;margin-top:5px;font-weight:700}

main{padding:16px 16px 0}

/* mascot */
.mascot .dish{transform-box:fill-box;transform-origin:center;animation:dish 2.4s ease-in-out infinite}
.mascot .arm{transform-box:fill-box;transform-origin:100% 100%;animation:wave 1.6s ease-in-out infinite}
@keyframes dish{0%,100%{transform:scaleX(1)}50%{transform:scaleX(.35)}}
@keyframes wave{0%,100%{transform:rotate(0)}50%{transform:rotate(18deg)}}
.bounce{animation:bounce .9s cubic-bezier(.3,1.6,.5,1) both}
@keyframes bounce{0%{transform:scale(.3) translateY(30px);opacity:0}100%{transform:none;opacity:1}}

/* home */
.hero{display:flex;align-items:flex-end;gap:10px}
.hero .mascot{width:96px;flex:none}
.bubble{background:var(--card);border:2px solid var(--line);border-radius:22px 22px 22px 6px;padding:12px 16px;margin-bottom:22px;font-family:var(--display);font-size:18px}
.scan-cta{width:100%;margin:14px 0 6px;background:var(--sun);color:#24306E;border-radius:24px;padding:16px 18px;display:flex;align-items:center;gap:14px;text-align:left;box-shadow:0 6px 0 #D99A12;transition:transform .08s,box-shadow .08s}
.scan-cta:active{transform:translateY(5px);box-shadow:0 1px 0 #D99A12}
.scan-cta .ic{width:58px;height:58px;border-radius:18px;background:#24306E;color:var(--sun);display:grid;place-items:center;flex:none}
.scan-cta .ic svg{width:32px;height:32px}
.scan-cta .big{font-family:var(--display);font-size:26px;font-weight:600;display:block;line-height:1.1}
.scan-cta .sub{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700;opacity:.8}
.scan-cta .sub svg{width:16px;height:16px}
.sec{display:flex;align-items:center;gap:8px;font-size:20px;margin:24px 2px 12px}
.sec svg{color:var(--navy2)}
.sec small{margin-left:auto;font-family:var(--body);font-size:13px;color:var(--muted);font-weight:700}

/* mission rings */
.rings{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.rcard{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:12px 6px 10px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px}
.ring{position:relative;width:64px;height:64px}
.ring svg.r{width:64px;height:64px;transform:rotate(-90deg)}
.ring .ri{position:absolute;inset:0;display:grid;place-items:center;color:var(--navy2)}
.ring .ri svg{width:26px;height:26px}
.rcard .rl{font-size:12px;font-weight:700;color:var(--muted);line-height:1.2}
.rcard .rv{font-family:var(--display);font-size:16px}
.claim{display:flex;align-items:center;gap:4px;background:var(--mint);color:#0F2A3A;font-weight:700;font-size:14px;padding:6px 12px;border-radius:12px;box-shadow:0 4px 0 #1E9C80;animation:pulse 1.2s ease-in-out infinite}
.claim svg{width:18px;height:18px}
@keyframes pulse{50%{transform:scale(1.07)}}
.done-tag{display:flex;align-items:center;gap:4px;color:var(--mint);font-weight:700;font-size:14px}
.done-tag svg{width:18px;height:18px}

/* wanted list */
.hunt{width:100%;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:18px;padding:12px 14px;display:flex;gap:12px;align-items:center;margin-bottom:10px}
.hunt:active{transform:scale(.98)}
.ticon{width:46px;height:46px;border-radius:14px;background:var(--mint-soft);color:var(--navy2);display:grid;place-items:center;flex:none;position:relative}
.ticon svg{width:24px;height:24px}
.ticon b{position:absolute;bottom:-6px;left:50%;transform:translateX(-50%);font-size:9px;background:var(--navy2);color:#fff;border-radius:6px;padding:0 4px;font-family:var(--body);letter-spacing:.3px}
.hunt .hb{flex:1;min-width:0}
.sn{font-family:var(--display);font-size:16px;font-weight:500}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:3px}
.tagc{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;color:var(--muted);background:var(--bg);border-radius:999px;padding:1px 8px}
.tagc svg{width:14px;height:14px}
.tagc.hot{background:var(--danger-soft);color:var(--danger)}
.bonus{background:var(--danger);color:#fff;font-family:var(--display);font-size:16px;padding:4px 10px;border-radius:999px;white-space:nowrap}
.demo-note{display:flex;align-items:center;justify-content:center;gap:6px;font-size:12px;font-weight:700;color:var(--muted);margin:22px 8px 0}
.demo-note svg{width:16px;height:16px}

/* bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;padding-bottom:env(safe-area-inset-bottom,0px);background:var(--card);border-top:2px solid var(--line)}
.nav-in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr 88px 1fr 1fr;align-items:end;height:70px}
.nav button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;font-weight:700;color:var(--muted);padding:8px 0 10px}
.nav button svg{width:24px;height:24px}
.nav button.on{color:var(--navy2)}
.nav button.on svg{stroke-width:2.6}
.nav .fab{align-self:start;margin-top:-26px;width:74px;height:74px;border-radius:24px;background:var(--sun);color:#24306E;box-shadow:0 6px 0 #D99A12;justify-content:center;justify-self:center;padding:0}
.nav .fab svg{width:34px;height:34px;stroke-width:2.4}
.nav .fab:active{transform:translateY(4px);box-shadow:0 2px 0 #D99A12}

/* generic */
.card{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:16px}
.seg{display:flex;background:var(--line);border-radius:14px;padding:4px;gap:4px;margin-bottom:14px}
.seg button{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:9px 6px;border-radius:11px;font-weight:700;font-size:15px;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 2px 0 rgba(0,0,0,.08)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:14px 18px;border-radius:16px;font-weight:700;font-size:16px;transition:transform .08s}
.btn:active{transform:translateY(4px)}
.btn.sun{background:var(--sun);color:#24306E;box-shadow:0 5px 0 #D99A12}
.btn.mint{background:var(--mint);color:#0F2A3A;box-shadow:0 5px 0 #1E9C80}
.btn.ghost{background:transparent;border:2px solid var(--line);color:var(--ink)}
.btn.navy{background:var(--navy2);color:#fff;box-shadow:0 5px 0 #24306E}
.btn[disabled]{opacity:.4;pointer-events:none}
.btn.full{width:100%}
.small{font-size:13px;color:var(--muted);font-weight:600}
.empty{text-align:center;padding:24px 10px}
.empty .mascot{width:110px}

/* badges */
.badges{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.badge{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:12px 6px;text-align:center}
.emb{width:60px;height:60px;margin:0 auto 6px;border-radius:50%;display:grid;place-items:center;color:#fff;box-shadow:inset 0 -5px 0 rgba(0,0,0,.15),0 0 0 4px var(--sun-soft)}
.emb svg{width:28px;height:28px;stroke-width:2.3}
.badge .bn{font-family:var(--display);font-size:14px}
.badge .bd{font-size:11px;color:var(--muted);font-weight:700;line-height:1.3;margin-top:2px}
.badge.locked .emb{background:var(--line)!important;color:var(--muted);box-shadow:none}
.badge.locked .bn{color:var(--muted)}
.rules{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.rule{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:10px 12px;display:flex;align-items:center;gap:10px}
.rule .ri{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--mint-soft);color:var(--navy2);flex:none}
.rule .rt{flex:1;font-size:13px;font-weight:700;line-height:1.2}
.rule b{font-family:var(--display);font-weight:500;color:var(--mint);font-size:17px}
.rule.neg .ri{background:var(--danger-soft);color:var(--danger)}
.rule.neg b{color:var(--danger)}

/* rank */
.podium{display:grid;grid-template-columns:1fr 1fr 1fr;align-items:end;gap:8px;margin:8px 0 16px}
.pod{text-align:center}
.pod .av{width:54px;height:54px;border-radius:50%;margin:0 auto 6px;display:grid;place-items:center;font-family:var(--display);font-size:17px;background:var(--mint-soft);border:3px solid var(--card)}
.pod .pn{font-size:13px;font-weight:700;line-height:1.3}
.pod .pp{font-size:12px;color:var(--muted);font-weight:700}
.pod .blk{margin-top:8px;border-radius:16px 16px 6px 6px;display:grid;place-items:center;font-family:var(--display);font-size:28px;color:#24306E}
.pod.p1 .blk{height:96px;background:var(--sun)}
.pod.p2 .blk{height:70px;background:#C9D3F0}
.pod.p3 .blk{height:54px;background:#F5C7A9}
.pod.me .av{border-color:var(--pink)}
.lrow{display:flex;align-items:center;gap:12px;padding:10px 14px;background:var(--card);border:2px solid var(--line);border-radius:16px;margin-bottom:8px}
.lrow .rk{font-family:var(--display);width:26px;text-align:center;color:var(--muted)}
.lrow .ln{flex:1;font-weight:700}
.lrow .lt{font-size:12px;color:var(--muted)}
.lrow .lp{font-family:var(--display);display:flex;align-items:center;gap:4px}
.lrow .lp svg{width:16px;height:16px;color:var(--sun);fill:var(--sun)}
.lrow.me{border-color:var(--pink)}

/* history */
.hrow{display:flex;gap:12px;background:var(--card);border:2px solid var(--line);border-radius:18px;padding:12px;margin-bottom:10px}
.thumb{width:62px;height:62px;border-radius:14px;flex:none;object-fit:cover;background:var(--mint-soft);color:var(--navy2);display:grid;place-items:center}
.thumb svg{width:28px;height:28px}
.hrow .hb{flex:1;min-width:0}
.loc{display:flex;align-items:center;gap:4px;font-size:13px;color:var(--muted);font-weight:600}
.loc svg{width:14px;height:14px;flex:none}
.loc span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hp{font-family:var(--display);color:var(--mint);white-space:nowrap;font-size:17px}
.hp.zero{color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;padding:2px 9px;border-radius:999px;font-weight:700;margin-top:5px}
.pill svg{width:14px;height:14px}
.st-active{background:var(--mint-soft);color:#178A70}
.st-spare{background:var(--sun-soft);color:#9A6A00}
.st-repair{background:var(--blue-soft);color:#3A49A0}
.st-faulty{background:var(--danger-soft);color:#C2323E}
.st-dispose{background:var(--line);color:var(--muted)}
:root[data-theme="dark"] [class^="st-"]{color:var(--ink)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) [class^="st-"]{color:var(--ink)}}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block}
.f-fresh{background:var(--mint)}.f-warn{background:var(--sun)}.f-stale{background:var(--danger)}

/* overlays */
.overlay{position:fixed;inset:0;z-index:50;background:rgba(14,19,48,.55);display:flex;align-items:flex-end;justify-content:center;padding-top:env(safe-area-inset-top,0px)}
.overlay[hidden]{display:none}
.sheet{background:var(--bg);width:100%;max-width:520px;border-radius:28px 28px 0 0;max-height:100%;display:flex;flex-direction:column;animation:up .35s cubic-bezier(.2,1.2,.4,1) both;padding-bottom:env(safe-area-inset-bottom,0px)}
@keyframes up{from{transform:translateY(60%);opacity:0}to{transform:none;opacity:1}}
.scan-sheet{height:100%}
.sh-head{padding:14px 16px 10px;display:flex;align-items:center;gap:12px}
.x{width:42px;height:42px;border-radius:50%;background:var(--card);border:2px solid var(--line);display:grid;place-items:center;flex:none}
.x svg{width:18px;height:18px}
.steps{flex:1;display:flex;align-items:center}
.steps .s{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--card);border:2px solid var(--line);color:var(--muted);flex:none;transition:.25s}
.steps .s svg{width:18px;height:18px}
.steps .s.on{background:var(--navy2);border-color:var(--navy2);color:#fff;transform:scale(1.12)}
.steps .s.past{background:var(--mint);border-color:var(--mint);color:#0F2A3A}
.steps .ln{flex:1;height:3px;background:var(--line);border-radius:2px}
.steps .ln.past{background:var(--mint)}
.sh-body{flex:1;overflow-y:auto;padding:6px 16px 20px}
.sh-foot{padding:12px 16px 14px;display:flex;gap:10px;border-top:2px solid var(--line);background:var(--card)}
.sh-foot .btn{flex:1}
.sh-foot .btn.back{flex:0 0 auto;padding:14px}
.q-title{display:flex;align-items:center;gap:10px;font-size:24px;margin:4px 0 14px}
.q-title svg{width:28px;height:28px;color:var(--navy2)}

.tip{display:flex;gap:8px;align-items:center;background:var(--sun-soft);border-radius:16px;padding:6px 8px 6px 4px;margin-bottom:14px;font-family:var(--display);font-size:16px}
.tip .mascot{width:40px;flex:none}
.tip span{flex:1}
.tip button{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:var(--muted)}
.tip button svg{width:16px;height:16px}

.viewfinder{position:relative;aspect-ratio:4/3;border-radius:22px;background:radial-gradient(circle at 50% 40%,#3A4790,#151B44);overflow:hidden;display:grid;place-items:center;margin-bottom:14px}
.viewfinder .tag{width:62%;height:34%;border-radius:10px;background:#F5F7FF;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;opacity:.9}
.viewfinder .codebars{width:78%;height:46%;background:repeating-linear-gradient(90deg,#1D2550 0 3px,transparent 3px 5px,#1D2550 5px 6px,transparent 6px 10px,#1D2550 10px 14px,transparent 14px 16px)}
.corner{position:absolute;width:40px;height:40px;border:5px solid var(--sun)}
.c1{top:16%;left:12%;border-right:0;border-bottom:0;border-radius:12px 0 0 0}
.c2{top:16%;right:12%;border-left:0;border-bottom:0;border-radius:0 12px 0 0}
.c3{bottom:16%;left:12%;border-right:0;border-top:0;border-radius:0 0 0 12px}
.c4{bottom:16%;right:12%;border-left:0;border-top:0;border-radius:0 0 12px 0}
.laser{position:absolute;left:14%;right:14%;height:3px;background:#FF5C7A;box-shadow:0 0 12px 3px rgba(255,92,122,.7);animation:laser 1.8s ease-in-out infinite}
@keyframes laser{0%,100%{top:22%}50%{top:76%}}
.viewfinder.busy .laser{animation-duration:.45s}

.input{width:100%;font:inherit;font-size:17px;font-weight:700;padding:14px 16px 14px 46px;border-radius:16px;border:2px solid var(--line);background:var(--card);color:var(--ink)}
.input:focus{border-color:var(--navy2);outline:none}
.inwrap{position:relative}
.inwrap>svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted)}
textarea.input{min-height:72px;resize:vertical;font-size:15px;font-weight:600}
.sugg{margin-top:10px}
.sg{width:100%;text-align:left;display:flex;gap:12px;align-items:center;padding:10px 12px;background:var(--card);border:2px solid var(--line);border-radius:16px;margin-bottom:8px}
.sg .sm{font-size:12px;color:var(--muted);font-weight:700}
mark{background:var(--sun-soft);color:inherit;border-radius:4px;padding:0 1px}

.found{background:var(--card);border:3px solid var(--mint);border-radius:22px;padding:16px;position:relative;animation:pop .4s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:none;opacity:1}}
.found .fh{display:flex;gap:14px;align-items:center}
.found .ticon{width:60px;height:60px;border-radius:18px}
.found .ticon svg{width:30px;height:30px}
.found .fn{font-family:var(--display);font-size:20px;line-height:1.2}
.found .ft{font-size:13px;color:var(--muted);font-weight:700}
.found .ok{position:absolute;top:-16px;right:14px;width:34px;height:34px;border-radius:50%;background:var(--mint);color:#0F2A3A;display:grid;place-items:center;border:3px solid var(--card)}
.found .ok svg{width:18px;height:18px;stroke-width:3}
.kv{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line);font-size:14px;font-weight:700}
.kv:last-child{border-bottom:0}
.kv>svg{color:var(--muted);width:18px;height:18px}
.kv span{flex:1;min-width:0;word-break:break-word}
.fresh-line{margin-top:12px;padding:10px 12px;border-radius:14px;font-size:14px;font-weight:700;display:flex;align-items:center;gap:8px}
.fresh-line svg{width:18px;height:18px}
.fresh-line .sp{flex:1}
.fresh-line.f-stale{background:var(--danger-soft)}
.fresh-line.f-warn{background:var(--sun-soft)}
.fresh-line.f-fresh{background:var(--mint-soft)}

.same{width:100%;display:flex;gap:12px;align-items:center;text-align:left;background:var(--mint-soft);border:2px dashed var(--mint);border-radius:18px;padding:12px 14px;margin-bottom:18px}
.same .si{width:44px;height:44px;border-radius:14px;background:var(--mint);color:#0F2A3A;display:grid;place-items:center;flex:none}
.same .big{font-family:var(--display);font-size:19px}
.same .sub{font-size:12px;color:var(--muted);font-weight:700}
.grp{margin-bottom:16px}
.grp h3{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--muted);font-family:var(--body);font-weight:700;margin-bottom:8px;text-transform:uppercase;letter-spacing:.5px}
.grp h3 svg{width:18px;height:18px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:9px 14px;border-radius:999px;background:var(--card);border:2px solid var(--line);font-size:15px;font-weight:700;transition:transform .1s}
.chip:active{transform:scale(.95)}
.chip.on{background:var(--navy2);border-color:var(--navy2);color:#fff}
.chip.site{display:flex;flex-direction:column;align-items:center;border-radius:16px;padding:8px 12px;min-width:76px;line-height:1.1}
.chip.site b{font-family:var(--display);font-size:20px;font-weight:500}
.chip.site small{font-size:11px;opacity:.75}
.chip.typ{display:flex;align-items:center;gap:6px}
.chip.typ svg{width:18px;height:18px}
.crumb{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700;background:var(--card);border-radius:12px;padding:8px 12px;margin-bottom:14px;border:2px solid var(--line);flex-wrap:wrap}
.crumb svg{width:14px;height:14px;color:var(--muted)}

.status-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stile{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:14px 6px;text-align:center;font-weight:700;font-size:14px;display:flex;flex-direction:column;align-items:center;gap:6px}
.stile .se{width:44px;height:44px;border-radius:14px;display:grid;place-items:center}
.stile .se svg{width:26px;height:26px}
.stile.on{border-color:var(--navy2);background:var(--navy2);color:#fff;box-shadow:0 5px 0 rgba(36,48,110,.25)}
.stile.on .se{background:rgba(255,255,255,.18)!important;color:#fff!important}

.photo-drop{display:grid;place-items:center;text-align:center;border:3px dashed var(--line);border-radius:22px;background:var(--card);min-height:240px;cursor:pointer;position:relative;overflow:hidden}
.photo-drop input{position:absolute;opacity:0;width:1px;height:1px}
.photo-drop .pe{width:84px;height:84px;border-radius:26px;background:var(--sun-soft);color:var(--navy2);display:grid;place-items:center;margin:0 auto 8px}
.photo-drop .pe svg{width:44px;height:44px}
.photo-drop .plus{font-family:var(--display);font-size:22px;color:var(--mint)}
.photo-drop img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.photo-drop .retake{position:absolute;bottom:10px;right:10px;background:rgba(14,19,48,.75);color:#fff;width:42px;height:42px;border-radius:50%;display:grid;place-items:center}

.review{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:4px 14px}
.auto{display:inline-flex;align-items:center;gap:3px;font-size:11px;background:var(--mint-soft);color:var(--ink);padding:1px 7px;border-radius:999px;font-weight:700}
.auto svg{width:12px;height:12px}
.preview{margin-top:14px;background:var(--navy);color:#fff;border-radius:20px;padding:12px 16px}
.preview .pl{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:700;padding:4px 0}
.preview .pl svg{width:18px;height:18px;color:var(--sun)}
.preview .pl span{flex:1}
.preview .pt{display:flex;justify-content:space-between;align-items:center;font-family:var(--display);font-size:26px;border-top:1px solid rgba(255,255,255,.2);margin-top:6px;padding-top:8px;color:var(--sun)}
.cool{display:flex;gap:10px;align-items:center;background:var(--sun-soft);border-radius:16px;padding:12px 14px;font-size:14px;font-weight:700;margin-top:14px;color:var(--ink)}
.cool svg{width:26px;height:26px;color:#C88A00}

/* celebration */
.celebrate{align-items:center;padding:20px}
.cel{background:var(--card);border-radius:30px;padding:22px 20px 20px;text-align:center;width:100%;max-width:400px;position:relative;z-index:2;animation:pop .45s cubic-bezier(.3,1.6,.5,1) both;max-height:100%;overflow-y:auto}
.cel .mascot{width:130px;margin-top:-6px}
.cel .gain{font-family:var(--display);font-size:60px;color:var(--mint);line-height:1;margin:4px 0 12px;font-weight:600}
.cel .gain.zero{color:var(--muted);font-size:40px}
.cel .lines{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-bottom:14px}
.cel .lines div{display:flex;align-items:center;gap:5px;background:var(--bg);border-radius:999px;padding:5px 12px;font-family:var(--display);font-size:16px;opacity:0;animation:fadeIn .3s forwards}
.cel .lines svg{width:18px;height:18px;color:var(--navy2)}
@keyframes fadeIn{to{opacity:1}}
.lvup{display:flex;align-items:center;justify-content:center;gap:8px;background:var(--sun);color:#24306E;border-radius:16px;padding:10px;font-family:var(--display);font-size:19px;margin-bottom:12px}
.newbadge{display:flex;align-items:center;gap:12px;background:var(--sun-soft);border-radius:16px;padding:10px 12px;margin-bottom:10px;text-align:left}
.newbadge .emb{width:48px;height:48px;margin:0;box-shadow:none}
.newbadge .emb svg{width:24px;height:24px}
.newbadge b{font-family:var(--display);font-weight:500;font-size:17px}
.cel .acts{display:flex;gap:10px}
.cel .acts .btn{flex:1}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:1}
.confetti i{position:absolute;top:-20px;width:10px;height:14px;border-radius:3px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}

/* guide */
.guide{align-items:center;padding:20px}
.gcard{background:var(--card);border-radius:30px;padding:24px 22px;width:100%;max-width:380px;text-align:center;animation:pop .4s cubic-bezier(.3,1.6,.5,1) both}
.gart{height:150px;display:grid;place-items:center;margin-bottom:8px}
.gart .mascot{width:120px}
.gicons{display:flex;align-items:center;justify-content:center;gap:12px}
.gicon{width:74px;height:74px;border-radius:22px;display:grid;place-items:center;color:#fff}
.gicon svg{width:38px;height:38px;stroke-width:2.2}
.gicons .or{font-family:var(--display);color:var(--muted);font-size:16px}
.gicons .arr{color:var(--muted)}
.gcard h2{font-size:26px;margin:4px 0 6px}
.gcard p{color:var(--muted);margin:0 0 16px;font-weight:700;font-size:15px}
.gdots{display:flex;justify-content:center;gap:6px;margin-bottom:16px}
.gdots i{width:8px;height:8px;border-radius:999px;background:var(--line);transition:.3s}
.gdots i.on{width:26px;background:var(--mint)}
.gacts{display:flex;gap:10px}
.gacts .btn{flex:1}

.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--navy);color:#fff;padding:12px 18px;border-radius:16px;z-index:80;font-weight:700;display:flex;align-items:center;gap:8px;box-shadow:0 6px 18px rgba(0,0,0,.25);animation:pop .3s both;max-width:90%}
.toast svg{color:var(--sun)}

.prof{text-align:center;padding:4px 16px 20px}
.prof .avatar{width:84px;height:84px;font-size:28px;margin:0 auto 10px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:16px 0}
.stats div{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:10px 4px;display:flex;flex-direction:column;align-items:center;gap:2px}
.stats svg{color:var(--navy2)}
.stats b{font-family:var(--display);font-size:22px;font-weight:500}
.idrow{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-bottom:6px}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
  .confetti{display:none}
}

/* ---------- v2 additions ---------- */
:root{--violet-soft:#EDE6FF}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--violet-soft:#2C2560}}
:root[data-theme="dark"]{--violet-soft:#2C2560}
.st-U{background:var(--mint-soft);color:#178A70}
.st-SP{background:var(--sun-soft);color:#9A6A00}
.st-F{background:var(--blue-soft);color:#3A49A0}
.st-WD{background:var(--line);color:var(--muted)}
.st-O{background:var(--violet-soft);color:#6C5BD4}
:root[data-theme="dark"] .st-U,:root[data-theme="dark"] .st-SP,:root[data-theme="dark"] .st-F,:root[data-theme="dark"] .st-O{color:var(--ink)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .st-U,:root:not([data-theme="light"]) .st-SP,:root:not([data-theme="light"]) .st-F,:root:not([data-theme="light"]) .st-O{color:var(--ink)}}
.code{font-family:var(--display);font-weight:600;letter-spacing:.3px}

/* no-label options */
.nlgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.nlopt{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:14px 10px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;font-weight:700;font-size:14px;line-height:1.2}
.nlopt .ni{width:48px;height:48px;border-radius:16px;display:grid;place-items:center;color:#fff}
.nlopt .ni svg{width:26px;height:26px}
.nlopt small{font-size:11px;color:var(--muted);font-weight:700}
.nlbar{display:flex;align-items:center;gap:8px;background:var(--danger-soft);color:var(--danger);border-radius:14px;padding:8px 12px;font-weight:700;font-size:14px;margin-bottom:12px}
.nlbar svg{width:18px;height:18px}
.nlbar button{margin-left:auto;font-size:13px;text-decoration:underline;color:var(--muted)}

/* location summary + option list */
.sumloc{display:flex;align-items:center;gap:12px;background:var(--card);border:2px solid var(--mint);border-radius:18px;padding:12px 14px;margin-bottom:14px}
.sumloc .si{width:42px;height:42px;border-radius:14px;background:var(--mint);color:#0F2A3A;display:grid;place-items:center;flex:none}
.sumloc .path{font-family:var(--display);font-size:20px;font-weight:500;display:flex;align-items:center;flex-wrap:wrap;gap:2px}
.sumloc .path svg{width:16px;height:16px;color:var(--muted)}
.sumloc .nm{font-size:12px;color:var(--muted);font-weight:700}
.sumloc .ed{margin-left:auto;width:40px;height:40px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;flex:none}
.sumloc .ed svg{width:18px;height:18px}
.sumloc.unsure{border-color:var(--sun)}
.sumloc.unsure .si{background:var(--sun)}
.optlist{background:var(--card);border:2px solid var(--line);border-radius:16px;overflow:hidden}
.optlist .search{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:2px solid var(--line)}
.optlist .search input{flex:1;border:0;background:none;font:inherit;font-weight:700;font-size:16px;color:var(--ink);outline:none}
.optlist .search svg{color:var(--muted)}
.optlist .rows{max-height:250px;overflow-y:auto}
.optrow{width:100%;display:flex;align-items:center;gap:12px;padding:10px 14px;text-align:left;border-bottom:1px solid var(--line)}
.optrow:last-child{border-bottom:0}
.optrow .code{font-size:18px;min-width:48px}
.optrow span{font-size:14px;font-weight:600;color:var(--muted)}
.optrow.on{background:var(--navy2);color:#fff}
.optrow.on span{color:#fff}
.chip.cn{display:flex;flex-direction:column;align-items:center;border-radius:16px;padding:7px 12px;min-width:64px;line-height:1.15}
.chip.cn b{font-family:var(--display);font-size:19px;font-weight:500}
.chip.cn small{font-size:11px;opacity:.75;font-weight:700}
.minor{display:flex;gap:8px;margin-top:4px}
.minor .btn{flex:1;padding:11px 10px;font-size:14px}

/* system + node */
.lockrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:10px 14px;font-family:var(--display);font-size:18px}
.lockrow svg{width:16px;height:16px;color:var(--muted)}
.lockrow .lk{margin-left:auto;display:flex;align-items:center;gap:4px;font-family:var(--body);font-size:12px;font-weight:700;color:var(--muted)}
.nodein{font-family:var(--display)!important;font-size:22px!important;letter-spacing:2px;text-transform:uppercase}
.nodecount{position:absolute;right:14px;top:50%;transform:translateY(-50%);font-size:12px;font-weight:700;color:var(--muted)}
.vmsg{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700;margin-top:8px;padding:6px 10px;border-radius:12px}
.vmsg svg{width:16px;height:16px}
.vmsg.ok{background:var(--mint-soft);color:#178A70}
.vmsg.warn{background:var(--sun-soft);color:#9A6A00}
.vmsg.info{background:var(--blue-soft);color:#3A49A0}
:root[data-theme="dark"] .vmsg{color:var(--ink)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .vmsg{color:var(--ink)}}

/* status tiles with codes */
.stile .sc{font-family:var(--display);font-size:22px;font-weight:600;line-height:1}
.stile small{font-size:11px;font-weight:700;opacity:.8}
.req{color:var(--danger)}

/* photo slots */
.slots{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.slot{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;background:var(--card);border:3px dashed var(--line);border-radius:20px;padding:10px 8px 12px;text-align:center;cursor:pointer;overflow:hidden;min-height:200px}
.slot input{position:absolute;opacity:0;width:1px;height:1px}
.slot.next{border-color:var(--sun);border-style:solid;animation:glow 1.6s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 0 0 5px var(--sun-soft)}}
.slot.done{border-style:solid;border-color:var(--mint)}
.slot .num{position:absolute;top:8px;left:8px;width:26px;height:26px;border-radius:50%;background:var(--navy2);color:#fff;font-family:var(--display);font-size:15px;display:grid;place-items:center;z-index:2}
.slot.done .num{background:var(--mint);color:#0F2A3A}
.slot .ill{width:100%;max-width:130px;aspect-ratio:1;display:grid;place-items:center}
.slot .ill svg{width:100%;height:100%}
.slot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.slot .cap{font-family:var(--display);font-size:17px;line-height:1.1}
.slot .cap small{display:block;font-family:var(--body);font-size:11px;color:var(--muted);font-weight:700}
.slot .retake{position:absolute;bottom:8px;right:8px;width:38px;height:38px;border-radius:50%;background:rgba(14,19,48,.75);color:#fff;display:grid;place-items:center;z-index:2}
.slot .retake svg{width:18px;height:18px}
.ptip{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.ptip .mascot{width:44px}
.ptip .say{flex:1;font-family:var(--display);font-size:20px;display:flex;align-items:center;gap:6px}
.ptip .say svg{width:22px;height:22px;color:var(--navy2)}
.ptip .q{width:40px;height:40px;border-radius:50%;background:var(--pink);color:#24306E;display:grid;place-items:center}

/* serial check result */
.check{margin-top:12px;border-radius:18px;padding:12px 14px;background:var(--card);border:2px solid var(--line)}
.check .ch{display:flex;align-items:center;gap:10px;font-family:var(--display);font-size:19px}
.check .ch .ci{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;flex:none}
.check .ch .ci svg{width:22px;height:22px}
.check.match{border-color:var(--mint)} .check.match .ci{background:var(--mint);color:#0F2A3A}
.check.unreadable{border-color:var(--sun)} .check.unreadable .ci{background:var(--sun);color:#24306E}
.check.mismatch{border-color:var(--danger)} .check.mismatch .ci{background:var(--danger);color:#fff}
.check.checking .ci,.check.na .ci,.check.override .ci,.check.skipped .ci{background:var(--line);color:var(--muted)}
.check.override,.check.skipped{border-color:var(--sun)}
.spin{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.hints{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 2px}
.hints span{display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:700;background:var(--sun-soft);border-radius:999px;padding:4px 10px}
.hints svg{width:15px;height:15px}
.diff{margin:10px 0;display:grid;grid-template-columns:auto 1fr;gap:6px 10px;align-items:center}
.diff .dl{display:flex;align-items:center;gap:4px;font-size:12px;font-weight:700;color:var(--muted)}
.diff .dl svg{width:16px;height:16px}
.diff .dv{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:17px;font-weight:700;letter-spacing:1px;word-break:break-all}
.diff .dv b{background:var(--danger);color:#fff;border-radius:3px;padding:0 1px}
.cacts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:8px}
.cacts button{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px;border-radius:14px;background:var(--bg);border:2px solid var(--line);font-size:12px;font-weight:700}
.cacts button svg{width:22px;height:22px;color:var(--navy2)}
.cacts.two{grid-template-columns:1fr 1fr}
.demo{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);font-size:12px;font-weight:700;color:var(--muted)}
.demo button{padding:4px 10px;border-radius:999px;border:2px solid var(--line);font-size:12px;font-weight:700;background:var(--card)}

/* photo examples */
.exgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:6px 0 16px}
.ex{border-radius:16px;background:var(--bg);padding:10px;text-align:center;font-weight:700;font-size:13px}
.ex .pic{height:84px;border-radius:12px;background:#C9D3E8;position:relative;overflow:hidden;display:grid;place-items:center;margin-bottom:6px}
.ex .lbl{width:78%;background:#fff;border-radius:6px;padding:6px 6px 4px;box-shadow:0 2px 0 rgba(0,0,0,.1)}
.ex .bars{height:22px;background:repeating-linear-gradient(90deg,#1D2550 0 2px,transparent 2px 4px,#1D2550 4px 5px,transparent 5px 8px)}
.ex .sn{font-family:ui-monospace,monospace;font-size:9px;color:#1D2550;margin-top:3px;letter-spacing:.5px}
.ex.blur .lbl{filter:blur(2px)}
.ex.glare .pic::after{content:"";position:absolute;left:30%;top:10%;width:55%;height:70%;border-radius:50%;background:radial-gradient(#fff 30%,rgba(255,255,255,0) 70%)}
.ex.cut .lbl{transform:translateX(52%)}
.ex .res{display:flex;align-items:center;justify-content:center;gap:4px}
.ex .res svg{width:16px;height:16px}
.ex.good .res{color:#178A70}.ex.bad .res{color:var(--danger)}

/* flags + export */
.flags{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.flag{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--sun-soft);color:#9A6A00}
.flag svg{width:14px;height:14px}
.flag.red{background:var(--danger-soft);color:var(--danger)}
:root[data-theme="dark"] .flag{color:var(--ink)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .flag{color:var(--ink)}}
.exportbar{display:flex;gap:10px;margin-bottom:14px}
.exportbar .btn{flex:1;padding:12px}
.field{margin-bottom:16px}
.field h3{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--muted);font-family:var(--body);font-weight:700;margin-bottom:8px;text-transform:uppercase;letter-spacing:.5px}
.field h3 svg{width:18px;height:18px}
.dates{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dates input{width:100%;font:inherit;font-weight:700;padding:12px;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--ink)}
.toggle{display:flex;align-items:center;gap:12px;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:12px 14px;font-weight:700;width:100%;text-align:left}
.toggle .sw{margin-left:auto;width:46px;height:28px;border-radius:999px;background:var(--line);position:relative;transition:.2s;flex:none}

/* ---------- image helpers ---------- */
function fileToCanvas(file, max){
  return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => { const img = new Image(); img.onload = () => {
    const k = Math.min(1, max / Math.max(img.width, img.height)), c = document.createElement('canvas');
    c.width = Math.round(img.width * k); c.height = Math.round(img.height * k); c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); res(c); };
    img.onerror = rej; img.src = r.result; }; r.onerror = rej; r.readAsDataURL(file); });
}
function shrink(canvas, max, q){
  const k = Math.min(1, max / Math.max(canvas.width, canvas.height)), c = document.createElement('canvas');
  c.width = Math.round(canvas.width * k); c.height = Math.round(canvas.height * k); c.getContext('2d').drawImage(canvas, 0, 0, c.width, c.height);
  return c.toDataURL('image/jpeg', q);
}
async function readPhoto(file, scanMax){
  // scanMax: also keep a larger copy for the barcode reader (thin bars disappear at 1400px)
  const full = await fileToCanvas(file, scanMax || 1400);
  const c = scanMax ? shrinkCanvas(full, 1400) : full;
  const age = file.lastModified ? Math.max(0, (Date.now() - file.lastModified) / 60000) : 0;   // minutes since the photo was taken
  return { canvas:c, scan:scanMax ? full : null, big:c.toDataURL('image/jpeg', .82), thumb:shrink(c, 180, .6), age, hash:dhash(c) };
}
function shrinkCanvas(canvas, max){
  const k = Math.min(1, max / Math.max(canvas.width, canvas.height)); if (k === 1) return canvas;
  const c = document.createElement('canvas'); c.width = Math.round(canvas.width * k); c.height = Math.round(canvas.height * k);
  c.getContext('2d').drawImage(canvas, 0, 0, c.width, c.height); return c;
}

/* ---------- barcode: ZXing (C++ engine, WebAssembly) reads the label on the phone, nothing is uploaded ---------- */
const ZX_URL = 'https://cdn.jsdelivr.net/npm/zxing-wasm@3.1.5/dist/iife/reader/index.js';
const ZX_FORMATS = ['Code93', 'Code128', 'Code39', 'DataMatrix', 'QRCode'];   // AEROTHAI labels: Code 93 = Asset13
let zxP = null;
function loadZX(){
  if (zxP) return zxP;
  zxP = new Promise((res, rej) => {
    if (window.ZXingWASM) return res(window.ZXingWASM);
    const s = document.createElement('script'); s.src = ZX_URL; s.async = true; s.crossOrigin = 'anonymous';
    s.onload = () => window.ZXingWASM ? res(window.ZXingWASM) : rej(new Error('ZXing missing'));
    s.onerror = () => rej(new Error('ZXing load failed'));
    document.head.appendChild(s);
  }).then(z => { try { z.prepareZXingModule({ fireImmediately:true }); } catch (e) {} return z; })
    .catch(e => { zxP = null; throw e; });
  return zxP;
}
const withTimeout = (p, ms) => Promise.race([p, new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), ms))]);
/** → texts read from barcodes in the photo ([] if none / reader not available) */
async function readBarcodes(canvas){
  try {
    const z = await withTimeout(loadZX(), 10000);
    const img = canvas.getContext('2d').getImageData(0, 0, canvas.width, canvas.height);
    const r = await withTimeout(z.readBarcodes(img, { formats:ZX_FORMATS, tryHarder:true, tryRotate:true, tryInvert:false, tryDownscale:true, maxNumberOfSymbols:4 }), 8000);
    return (r || []).filter(x => x && x.isValid !== false && x.text).map(x => String(x.text).trim()).filter(t => t.length >= 5);
  } catch (e){ console.warn('barcode', e && e.message || e); return []; }
}
/** 256-bit difference hash (hex): near-identical photos give near-identical hashes. */
function dhash(canvas){
  try {
    const w = 17, h = 16, c = document.createElement('canvas'); c.width = w; c.height = h;
    const g = c.getContext('2d'); g.drawImage(canvas, 0, 0, w, h);
    const d = g.getImageData(0, 0, w, h).data, lum = i => d[i] * .299 + d[i + 1] * .587 + d[i + 2] * .114;
    let bits = '';
    for (let y = 0; y < h; y++) for (let x = 0; x < 16; x++) bits += lum((y * w + x) * 4) > lum((y * w + x + 1) * 4) ? '1' : '0';
    let hex = ''; for (let i = 0; i < 256; i += 4) hex += parseInt(bits.slice(i, i + 4), 2).toString(16);
    return hex;
  } catch (e){ return ''; }
}

    '<label class="up ' + (img ? 'on' : '') + '">' + (img ? '<img src="' + esc(img) + '" alt="">' : ic('camera')) + '<input type="file" accept="image/*" onchange="pickAvatarImg(this,\'' + fn + '\')"></label></div>';
}
async function pickAvatarImg(input, fn){
  const f = input.files && input.files[0]; if (!f) return;
  const c = await fileToCanvas(f, 600), side = Math.min(c.width, c.height), sq = document.createElement('canvas');
  sq.width = sq.height = 160; sq.getContext('2d').drawImage(c, (c.width - side) / 2, (c.height - side) / 2, side, side, 0, 0, 160, 160);
  const url = sq.toDataURL('image/jpeg', .7);
  if (fn === 'regAv'){ A.r.avatarImg = url; renderAuth(); } else { PROF.avatarImg = url; openProfile(); }
}
function regAv(k){ A.r.avatar = k; A.r.avatarImg = ''; renderAuth(); }

function onUsername(inp){
  const p = inp.selectionStart; inp.value = inp.value.toLowerCase().replace(/[^a-z0-9._]/g, ''); inp.setSelectionRange(p, p);
  A.r.username = inp.value; A.rerr.username = ''; A.nameOk = null; clearTimeout(A.nameTimer);
  const box = $('#namemsg'); if (box) box.innerHTML = '';
  if (A.r.username.length < 3){ if (box && A.r.username) box.innerHTML = '<div class="vmsg warn">' + ic('alert') + '3+ characters</div>'; return; }
  A.nameTimer = setTimeout(() => call('checkName', { username:A.r.username }).then(r => { A.nameOk = r.free; const b = $('#namemsg'); if (b) b.innerHTML = r.free ? '<div class="vmsg ok">' + ic('check') + 'Username available</div>' : '<div class="vmsg bad">' + ic('x') + 'Username taken</div>'; }).catch(() => {}), 400);
}
async function doLogin(){
  A.err = ''; if (!A.email || !A.pw){ A.err = 'Enter email and password'; return renderAuth(); }
  A.busy = true; renderAuth();
  try { const r = await call('login', { email:A.email, pw:A.pw }); A.busy = false; A.pw = ''; setToken(r.token); applyBoot(r); hideAuth(); tab = 'home'; render(); toast('Hi, ' + USER.username + '!', 'login'); maybeGuide(); loadOut(); }
  catch (e){ A.busy = false; A.pw = '';
    if (e.message === 'PENDING') A.screen = 'pending';
    else if (e.message === 'UNVERIFIED'){ A.r.email = e.data.email; A.screen = 'mail'; }
    else A.err = e.message;
    renderAuth(); }
}
async function doRegister(){
  const r = A.r, e = {};
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(r.email)) e.email = 'Check your email';
  if (!/^[a-z0-9._]{3,20}$/.test(r.username)) e.username = '3-20 letters, numbers, . or _';
  else if (A.nameOk === false) e.username = 'Username taken';
  if (r.pw.length < 6) e.pw = '6+ characters'; else if (r.pw !== r.pw2) e.pw2 = "Doesn't match";
  A.rerr = e; if (Object.keys(e).length) return renderAuth();
  A.busy = true; renderAuth();
  try { await call('register', { email:r.email, username:r.username, pw:r.pw, avatar:r.avatar, avatarImg:r.avatarImg }); A.screen = 'mail'; r.pw = r.pw2 = ''; }
  catch (err){ A.rerr = { [(err.data && err.data.field) || 'other']:err.message }; }
  A.busy = false; renderAuth();
}
async function doResend(){ try { await call('resend', { email:A.r.email || A.email }); toast('Sent again', 'mail'); } catch (e){ toast(e.message, 'alert'); } }
async function doForgot(){
  A.err = ''; A.info = ''; if (!A.fEmail.trim()){ A.err = 'Enter your email'; return renderAuth(); }
  A.busy = true; renderAuth();
  try { await call('forgot', { email:A.fEmail.trim() }); A.info = 'Link sent \u00b7 check your email'; }
  catch (e){ A.err = e.message === 'NOT_REGISTERED' ? 'This email is not registered yet. Please register.' : e.message; }
  A.busy = false; renderAuth();
}
async function doSetPw(){
  A.err = ''; if (A.r.pw.length < 6){ A.err = '6+ characters'; return renderAuth(); } if (A.r.pw !== A.r.pw2){ A.err = "Doesn't match"; return renderAuth(); }
  A.busy = true; renderAuth();
  try { await call('setNewPw', { token:A.reset, pw:A.r.pw }); A.reset = null; A.r.pw = A.r.pw2 = ''; A.tab = 'login'; toast('Password saved \u00b7 log in', 'check'); }
  catch (e){ A.err = e.message; }
  A.busy = false; renderAuth();
}
function logout(){ const t = TOKEN; setToken(null); USER = null; if (t) google.script.run.api('logout', t, {}); A.tab = 'login'; A.screen = null; showAuth(); }

async function loadMinePhotos(x){
  for (let i = 0; i < 3; i++){

    const box = $('#dp-' + i); if (!box || $('#sheet').hidden) return;

    if (r && r.src){ const img = box.querySelector('img') || box.appendChild(document.createElement('img')); img.src = r.src; img.style.filter = ''; img.alt = 'Photo ' + (i + 1); }
  }
}

/* ================= SCAN FLOW ================= */
const STEP_ICONS = ['scan', 'pin', 'camera', 'check'];
function newDraft(){ return { step:1, busy:false, item:null, reported:null, isNew:false, q:'', results:null, label:null, read:'', snapMsg:'', timing:null, labelFromStep1:false,
  nf:{ number:'', detail:'', note:'' }, tokens:[], location:null, locQ:'', locNew:false, tooBig:null, ph:[null, null, null] }; }
function openScan(){ loadZX().catch(() => {}); D = newDraft(); $('#scan').hidden = false; document.body.style.overflow = 'hidden'; $('#scanClose').innerHTML = ic('x'); renderScan(); }
function closeScan(){ $('#scan').hidden = true; document.body.style.overflow = ''; D = null; }
const tip = t => '<div class="tip">' + mascot('happy') + '<span>' + t + '</span></div>';
function canNext(){
  switch (D.step){
    case 1: return D.isNew ? !!D.label && nrm(D.nf.number).length >= 4 && !!D.nf.detail.trim() : !!(D.item && !D.item.found);
    case 2: return !!D.location;
    case 3: return D.tooBig !== null && D.ph.every(Boolean);
    default: return true;
  }
}
function renderScan(){
  $('#steps').innerHTML = STEP_ICONS.map((n, i) => (i ? '<span class="ln ' + (i < D.step ? 'past' : '') + '"></span>' : '') + '<span class="s ' + (i + 1 === D.step ? 'on' : i + 1 < D.step ? 'past' : '') + '">' + ic(i + 1 < D.step ? 'check' : n) + '</span>').join('');
  $('#scanBody').innerHTML = [step1, step2, step3, step4][D.step - 1]();
  updateFoot();
}
function updateFoot(){
  const back = D.step > 1 ? '<button class="btn ghost back" onclick="goStep(-1)" aria-label="Back">' + ic('back') + '</button>' : '';
  let main;
  if (D.step === 1 && D.item && D.item.found) main = '<button class="btn sun" onclick="openScan()">' + ic('scan') + 'Scan another</button>';
  else if (D.step === 4) main = '<button class="btn mint" id="subBtn" onclick="submit()">' + ic('check') + 'Submit</button>';
  else main = '<button class="btn sun" ' + (canNext() ? '' : 'disabled') + ' onclick="goStep(1)">Next ' + ic('next') + '</button>';
  $('#scanFoot').innerHTML = back + main;
}
async function goStep(d){
  if (d > 0 && !canNext()) return;
  if (d > 0 && D.step === 1 && D.isNew){
    // the typed number may be in SAP or already reported: check before going on
    const my = D, btn = $('#scanFoot .btn.sun'); if (btn){ btn.disabled = true; btn.innerHTML = ic('loader', 'spin') + 'Checking'; }
    let r = null; try { r = await call('lookup', { codes:[D.nf.number] }); } catch (e){ if (e.message === 'AUTH') return; }
    if (my !== D) return;
    if (r && r.item){ D.isNew = false; D.item = r.item; renderScan(); toast('It is in the list', 'search'); return; }
    if (r && r.reported){ D.isNew = false; D.reported = r.reported; renderScan(); return; }
  }
  if (d > 0 && D.step === 1 && D.label && !D.ph[0]){ D.ph[0] = D.label; D.labelFromStep1 = true; }   // the label photo is photo 1 (no second barcode photo)
  D.step += d; renderScan(); $('#scanBody').scrollTop = 0;
}

/* ---------- step 1: photo of the label, or type the number ---------- */
function step1(){
  if (D.item) return D.item.found ? alreadyCard(D.item) : foundCard(D.item);
  if (D.reported) return reportedCard(D.reported);
  if (D.isNew) return addNewForm();
  const l = D.label;
  return tip('Snap the label or type the number') +
    '<div class="snaprow">' + (l ? '<img class="snapthumb" src="' + l.thumb + '" alt="Label photo">' : '') +
    '<label class="btn sun ' + (D.busy ? 'dis' : '') + '" style="flex:1">' + ic(D.busy ? 'loader' : 'camera', D.busy ? 'spin' : '') + (D.busy ? esc(D.busy) : l ? 'Retake label photo' : 'Photo of the label') +
    '<input type="file" accept="image/*" capture="environment" onchange="onSnap(this)" style="position:absolute;opacity:0;width:1px;height:1px" ' + (D.busy ? 'disabled' : '') + '></label></div>' +
    (D.snapMsg ? '<div class="vmsg warn">' + ic('keyboard') + esc(D.snapMsg) + '</div>' : '') +
    '<div class="ordiv"><span>or type</span></div>' +
    '<div class="inwrap">' + ic('hash') + '<input id="q" class="input" placeholder="Asset / S/N / Invent no." value="' + esc(D.q) + '" autocomplete="off" autocapitalize="characters" oninput="onQuery(this.value)"></div>' +
    (D.tokens.length > 1 ? '<div class="chips" style="margin-top:8px">' + D.tokens.slice(0, 4).map(t => '<button class="chip sm" onclick="useToken(\'' + keep(t) + '\')">' + esc(t) + '</button>').join('') + '</div>' : '') +
    '<div class="sugg" id="sugg">' + suggHtml() + '</div>';
}
function useToken(k){ const t = REG[k]; D.q = t; renderScan(); onQuery(t); }
async function onSnap(input){
  const file = input.files && input.files[0]; input.value = ''; if (!file) return;
  const my = D, t0 = Date.now(); D.busy = 'Reading the barcode\u2026'; D.snapMsg = ''; D.tokens = []; renderScan();
  let ph; try { ph = await readPhoto(file, 3000); } catch (e){ D.busy = false; renderScan(); toast("Can't open photo", 'alert'); return; }
  if (my !== D) return;
  D.label = { big:ph.big, thumb:ph.thumb, age:ph.age, hash:ph.hash };
  const tm = D.timing = { how:'typed', decode:0, ocr:0, lookup:0, total:0 };
  // 1) barcode on the phone
  const td = Date.now(), codes = await readBarcodes(ph.scan); tm.decode = Date.now() - td;
  ph.scan = null;
  if (my !== D) return;
  let r = null;
  if (codes.length){
    D.busy = 'Looking it up\u2026'; renderScan();
    try { r = await call('scan', { codes, hash:ph.hash }); } catch (e){ if (e.message === 'AUTH') return; }
    if (my !== D) return;
    if (r && r.ms) tm.lookup = r.ms.lookup || 0;
    if (r && r.item){ tm.how = 'barcode'; tm.total = Date.now() - t0; D.busy = false; D.item = r.item; D.read = r.read || ''; D.pick = 'barcode';
      if (navigator.vibrate) try { navigator.vibrate(50); } catch (e) {}
      renderScan(); return; }
    if (r && r.reported){ D.busy = false; D.reported = r.reported; renderScan(); return; }
    r = null;   // barcode read but not in the list: OCR would read the same number → go straight to typing
  } else {
    // 2) no barcode → OCR on the server as before; never wait forever
    D.busy = 'Reading the number\u2026'; renderScan();
    try { r = await withTimeout(call('identify', { image:ph.big, hash:ph.hash }), 30000); } catch (e){ if (e.message === 'AUTH') return; }
    if (my !== D) return;
    if (r && r.ms){ tm.ocr = r.ms.ocr || 0; tm.lookup += r.ms.lookup || 0; }
  }
  tm.total = Date.now() - t0;
  D.busy = false;
  if (codes.length) D.tokens = codes.slice();
  if (r && r.item){ tm.how = 'photo'; D.item = r.item; D.read = r.read || ''; D.pick = 'photo'; }
  else if (r && r.reported) D.reported = r.reported;
  else {
    D.tokens = D.tokens.concat((r && r.tokens) || []).filter((t, i, a) => a.indexOf(t) === i);
    D.snapMsg = D.tokens.length ? 'Not found from the photo \u00b7 check the number below' : "Can't read the number \u00b7 type it below";
    D.q = (D.tokens[0] || '').toUpperCase();
  }
  if (navigator.vibrate) try { navigator.vibrate(50); } catch (e) {}
  renderScan();
  if (!D.item && !D.reported){ if (D.q) onQuery(D.q); setTimeout(() => { const q = $('#q'); if (q) q.focus(); }, 80); }
}
let qTimer = null, qSeq = 0;
function onQuery(v){
  D.q = v; const q = v.trim(); clearTimeout(qTimer); qSeq++;
  if (q.length < 3){ D.results = null; $('#sugg').innerHTML = q ? '<p class="small" style="text-align:center">3+ characters</p>' : ''; return; }
  $('#sugg').innerHTML = '<div class="count">' + ic('loader', 'spin') + '</div>';
  const seq = qSeq, my = D;
  qTimer = setTimeout(async () => {
    let r; try { r = await call('search', { q }); } catch (e){ if (seq === qSeq && $('#sugg')) $('#sugg').innerHTML = errMsg(e.message); return; }
    if (seq !== qSeq || my !== D) return;
    D.results = r; if ($('#sugg')) $('#sugg').innerHTML = suggHtml();
  }, 350);
}
function hl(text, q){ text = String(text || ''); const i = text.toUpperCase().indexOf(q.toUpperCase()); return i < 0 || !q ? esc(text) : esc(text.slice(0, i)) + '<mark>' + esc(text.slice(i, i + q.length)) + '</mark>' + esc(text.slice(i + q.length)); }
function suggHtml(){
  const r = D.results; if (!r) return '';
  const q = D.q.trim();
  let h = r.items.map(a => '<button class="sg" onclick="pickItem(\'' + keep(a) + '\')">' + ticon(a.detail) + '<span style="min-width:0;flex:1"><span class="sn">' + hl(a.detail, q) + '</span><br><span class="sm">' + [hl(a.asset, q), a.serial ? 'S/N ' + hl(a.serial, q) : '', a.inv ? hl(a.inv, q) : ''].filter(Boolean).join(' \u00b7 ') + '</span>' +
    (a.found ? '<br><span class="sm found-by">' + ic('lock') + 'Found by ' + esc(a.found.by) + '</span>' : '') + '</span></button>').join('');
  h += (r.news || []).map(n => '<div class="card small">' + ic('clock') + ' <b>' + esc(n.number) + '</b> \u00b7 ' + esc(n.detail) + '<br>Already reported by ' + esc(n.by) + ' \u00b7 ' + n.state + '</div>').join('');
  if (r.total > r.items.length) h += '<p class="small" style="text-align:center">+' + (r.total - r.items.length) + ' more \u00b7 type more</p>';
  if (!r.items.length && q.length >= 4) h += '<div class="card"><div class="row" style="font-family:var(--display);font-size:18px">' + ic('plus') + 'Not in the list</div><p class="small" style="margin:4px 0 10px">Has an Asset / Serial number? Add it.</p><button class="btn navy full" onclick="startNew(D.q)">' + ic('plus') + 'Add new</button></div>';
  return h || '<p class="small" style="text-align:center">No match</p>';
}

let OUT = [], pumping = false;
const outKey = () => 'rqg-out:' + (USER ? USER.username : '');
function saveOut(){ try { localStorage.setItem(outKey(), JSON.stringify(OUT.map(o => Object.assign({}, o, { state:'wait' })))); } catch (e){ try { localStorage.removeItem(outKey()); } catch (e2) {} } }
function loadOut(){
  let add = 0;
  try { (JSON.parse(localStorage.getItem(outKey()) || '[]') || []).forEach(o => { if (!OUT.some(x => x.rid === o.rid)){ OUT.push(o); if (o.kind === 'find') add += o.pts; } }); } catch (e) {}
  if (add){ USER.points += add; refreshScreen(); }
  pump();
}
async function pump(){
  if (pumping || !USER) return; pumping = true;
  for (;;){
    const o = OUT.find(x => x.state !== 'error'); if (!o) break;
    o.state = 'sending'; renderOut();
    try { const r = await call(o.kind === 'new' ? 'submitNew' : 'submitFind', Object.assign({ rid:o.rid }, o.payload)); outDone(o, r); }
    catch (e){
      if (e.message === 'AUTH'){ o.state = 'wait'; break; }
      const d = e.data || {};
      if ((e.message === 'ALREADY' && d.found && d.found.by === USER.username) || (e.message === 'REPORTED' && d.reported && d.reported.by === USER.username)){ outDone(o, {}); continue; }   // saved by an earlier try
      if (['ALREADY', 'REPORTED', 'IN_LIST', 'Item not found'].includes(e.message)){ outDrop(o, e); continue; }
      o.tries = (o.tries || 0) + 1; o.state = 'error'; o.err = e.message || 'No connection';
      setTimeout(() => { if (o.state === 'error'){ o.state = 'wait'; pump(); } }, Math.min(30000, 4000 * o.tries));
    }
  }
  pumping = false; renderOut();
}
function retryOut(){ OUT.forEach(o => { if (o.state === 'error') o.state = 'wait'; }); pump(); }
const outPts = () => OUT.reduce((s, o) => s + (o.kind === 'find' ? o.pts : 0), 0);
function outDone(o, r){
  OUT = OUT.filter(x => x !== o); saveOut();
  if (r.points != null) USER.points = r.points + outPts();
  if (r.leaderboard){ LB = r.leaderboard; const me = LB.find(x => x.username === USER.username); if (me) me.points = USER.points; }
  if (r.locations) LOC = r.locations;
  refreshScreen(); MINE = null;
}
function outDrop(o, e){
  OUT = OUT.filter(x => x !== o); saveOut();
  if (o.kind === 'find'){ USER.points -= o.pts; const me = LB.find(x => x.username === USER.username); if (me) me.points -= o.pts; }
  const d = e.data || {};
  const why = e.message === 'ALREADY' ? (d.found ? d.found.by : 'Someone') + ' found it first \u00b7 no points'
    : e.message === 'REPORTED' ? 'Already reported by ' + (d.reported ? d.reported.by : 'someone')
    : e.message === 'IN_LIST' ? 'It is in the SAP list \u00b7 scan it again' : e.message;
  refreshScreen(); toast(o.label + ': ' + why, 'alert');
}
function refreshScreen(){ if (!USER || !$('#auth').hidden) return; renderTop(); if (tab === 'home' && $('#scan').hidden) $('#view').innerHTML = viewHome(); else renderOut(); }
function outHtml(){
  if (!OUT.length) return '<div id="outbar"></div>';
  const err = OUT.some(o => o.state === 'error');
  return '<div id="outbar"><button class="outbar ' + (err ? 'err' : '') + '" onclick="retryOut()">' + ic(err ? 'alert' : 'loader', err ? '' : 'spin') +
    '<span class="sp"><b>' + (err ? "Couldn't send yet" : 'Sending ' + OUT.length + ' item' + (OUT.length > 1 ? 's' : '') + '\u2026') + '</b><br><span class="small">' + (err ? 'Tap to try again \u00b7 we also retry by ourselves' : 'Keep the app open until it is done') + '</span></span></button></div>';
}
function renderOut(){ const el = $('#outbar'); if (el) el.outerHTML = outHtml(); }

  const sw = '<div class="seg" style="margin-bottom:12px"><button class="' + (FMODE === 'check' ? 'on' : '') + '" onclick="FMODE=\'check\';renderAdmin()">' + ic('alert') + 'Needs check' + (ADMD.toCheck ? ' <span class="cnt">' + ADMD.toCheck + '</span>' : '') + '</button><button class="' + (FMODE === 'all' ? 'on' : '') + '" onclick="FMODE=\'all\';renderAdmin()">' + ic('list') + 'All finds</button></div>';
  if (FMODE === 'check') return sw + checkList();
  return sw + '<div class="inwrap" style="margin-bottom:12px">' + ic('search') + '<input class="input" id="fq" placeholder="Asset, serial, user, room\u2026" value="' + esc(FQ) + '" onkeydown="if(event.key===\'Enter\'){FQ=this.value;FL=null;renderAdmin()}"></div>' +
    (FL ? (FL.finds.length ? FL.finds.map(f => '<button class="hrow gear" onclick="openAsset(\'' + esc(f.key) + '\')">' + (f.thumbs[0] ? '<img class="thumb" src="' + esc(f.thumbs[0]) + '" alt="">' : '<div class="thumb">' + ic(kind(f.detail)[0]) + '</div>') +
      '<div class="hb"><div class="sn">' + esc(f.detail) + '</div><div class="loc"><span class="code">' + esc(f.key) + '</span></div><div class="loc">' + ic('pin') + '<span>' + esc(f.location) + '</span></div><div class="loc">' + ic('user') + '<span>' + esc(f.by) + ' \u00b7 ' + fmtAt(f.at) + '</span></div>' +
      (f.tooBig ? '<span class="flag">Too big</span> ' : '') + ((f.flags || []).length ? '<span class="flag ' + (f.verdict === 'OK' ? '' : 'red') + '">' + (f.verdict ? 'Checked ' + f.verdict : 'Needs check') + '</span> ' : '') + (f.state === 'Reset' ? '<span class="flag red">Reset</span>' : '') + '</div><div class="hp">+' + f.points + '</div></button>').join('') + (FL.total > FL.finds.length ? '<p class="small" style="text-align:center">Showing ' + FL.finds.length + ' of ' + FL.total + '</p>' : '')
      : '<div class="empty"><p class="small">No finds</p></div>') : '<div class="count">' + ic('loader', 'spin') + '</div>') +
    '<button class="btn ghost full" style="margin-top:8px" onclick="openAddAsset()">' + ic('plus') + 'Add asset to list</button>';
}
async function loadFinds(){ try { FL = await call('finds', { q:FQ }); } catch (e){ FL = { finds:[], total:0 }; toast(e.message, 'alert'); } if (ADMT === 'finds') renderAdmin(); }
/* ---------- admin: finds that need a check ---------- */
let FMODE = 'check', CK = null;
const FLAG_TXT = f => f === 'label-mismatch' ? "Label \u2260 item" : f === 'label-unreadable' ? "Label unreadable" : f === 'label-unavailable' ? 'Label not checked' : f === 'old-photo' ? 'Old photo' : f.startsWith('dup:') ? 'Same photo as ' + f.slice(4) : f;
async function loadChecks(){ try { CK = await call('checks'); } catch (e){ CK = { checks:[], total:0 }; if (e.message !== 'AUTH') toast(e.message, 'alert'); } if (ADMT === 'finds' && FMODE === 'check') renderAdmin(); }
function checkList(){
  if (!CK) return '<div class="count">' + ic('loader', 'spin') + '</div>';
  if (!CK.checks.length) return '<div class="empty">' + mascot('happy') + '<p class="small">Nothing to check \u00b7 all good</p></div>';
  return CK.checks.map(f => { const k = keep(f);
    return '<div class="card2 pend"><div class="row"><b class="ttl2">' + esc(f.detail) + '</b><span class="hp" style="margin-left:auto">+' + f.points + '</span></div>' +
      '<div class="small">' + esc(f.id) + ' \u00b7 by <b>' + esc(f.by) + '</b> \u00b7 ' + fmtAt(f.at) + ' \u00b7 ' + ic('pin') + esc(f.location) + '</div>' +
      '<div class="chips" style="margin:8px 0">' + f.flags.map(x => '<span class="flag red">' + esc(FLAG_TXT(x)) + '</span>').join(' ') + (f.pick === 'typed' ? ' <span class="flag">Typed</span>' : f.pick === 'barcode' ? ' <span class="flag">Barcode</span>' : '') + '</div>' +
      '<div class="ckgrid"><div class="ckimg" id="ck-' + k + '">' + (f.thumbs[0] ? '<img src="' + esc(f.thumbs[0]) + '" alt="Label photo">' : '') + '</div>' +
      '<div class="small"><div>Item</div><b class="mono">' + esc(f.serial || '\u2014') + '</b><br><span class="mono">' + esc(f.key) + '</span>' + (f.inv ? '<br><span class="mono">' + esc(f.inv) + '</span>' : '') +
      '<div style="margin-top:6px">Read from photo</div><b class="mono">' + esc(f.read || '\u2014') + '</b></div></div>' +
      photoLinks(f.photos, f.thumbs) +
      '<div class="row" style="margin-top:10px"><button class="btn mint" style="flex:1" onclick="doCheck(\'' + k + '\',\'OK\')">' + ic('check') + 'OK</button>' +
      '<button class="btn ghost" style="flex:1" onclick="wrongBox(\'' + k + '\')">' + ic('x') + 'Wrong</button></div><div id="wb-' + k + '"></div></div>'; }).join('') +
    (CK.total > CK.checks.length ? '<p class="small" style="text-align:center">Showing ' + CK.checks.length + ' of ' + CK.total + '</p>' : '');
}
async function loadCheckPhotos(){
  if (!CK) return;
  for (const f of CK.checks){
    const k = Object.keys(REG).reverse().find(x => REG[x] === f), box = k && $('#ck-' + k); if (!box || box.dataset.full) continue;
    let r = null; try { r = await call('photo', { id:f.id, i:0 }); } catch (e) {}
    const b2 = $('#ck-' + k); if (!b2) return;
    if (r && r.src){ b2.dataset.full = 1; b2.innerHTML = '<img src="' + r.src + '" alt="Label photo">'; }
  }
}
function wrongBox(k){
  const f = REG[k];
  $('#wb-' + k).innerHTML = '<div class="dz" style="margin-top:8px">' + lbl('Deduct points from ' + esc(f.by)) + '<div class="row2"><input class="input np" id="wn-' + k + '" type="number" value="' + f.points + '" style="max-width:90px"><input class="input np" id="wr-' + k + '" placeholder="Reason \u00b7 e.g. wrong item" value="Wrong item"></div>' +
    '<button class="btn navy full" style="margin-top:8px" onclick="doCheck(\'' + k + '\',\'Wrong\')">' + ic('minus') + 'Mark wrong & deduct</button></div>';
}
async function doCheck(k, verdict){
  const f = REG[k];
  try {
    const r = await call('setCheck', { id:f.id, verdict, deduct:verdict === 'Wrong' ? ($('#wn-' + k) || {}).value : 0, reason:verdict === 'Wrong' ? ($('#wr-' + k) || {}).value : '' });
    CK = r; if (r.counts){ ADM = Object.assign(ADM || {}, r.counts); ADMD = Object.assign(ADMD || {}, r.counts); }
    toast(verdict === 'OK' ? 'Checked \u00b7 OK' : 'Marked wrong', verdict === 'OK' ? 'check' : 'minus'); renderNav(); renderAdmin();
  } catch (e){ toast(e.message, 'alert'); }
}
let AS = null;
async function openAsset(key){
  $('#sheet').innerHTML = sheetWrap('Asset', '<div class="count">' + ic('loader', 'spin') + '</div>'); $('#sheet').hidden = false;
  try { AS = await call('asset', { key }); } catch (e){ $('#sheet .sh-body').innerHTML = errMsg(e.message); return; }
  renderAsset();
}
function renderAsset(){
  const a = AS.item;
  const findsHtml = AS.finds.map(f => { const k = keep(f);
    return '<div class="dz"><div class="row"><b>' + esc(f.by) + '</b><span class="small">' + fmtAt(f.at) + '</span><span class="bonus" style="margin-left:auto">+' + f.points + '</span></div>' +
      '<div class="small">' + (f.tooBig ? 'Too big to move' : 'Moved to ASSET ZONE') + ' \u00b7 barcode ' + esc(f.check || '-') + (f.state === 'Reset' ? ' \u00b7 <b>RESET</b>' : '') + '</div>' + photoLinks(f.photos, f.thumbs) +
      lbl('Location') + locSelect('fl-' + k, f.location) +
      '<div class="row" style="margin-top:8px;flex-wrap:wrap"><button class="chip" onclick="saveFindLoc(\'' + k + '\')">' + ic('pin') + 'Save location</button>' +
      '<button class="chip danger" onclick="deduct(\'' + k + '\')">' + ic('minus') + 'Deduct points</button>' + (f.state !== 'Reset' ? '<button class="chip" onclick="resetFind(\'' + k + '\')">' + ic('refresh') + 'Reset find</button>' : '') + '</div></div>'; }).join('');
  const pts = AS.points.map(p => '<div class="small">' + fmtAt(p.at) + ' \u00b7 <b>' + esc(p.user) + '</b> ' + (p.delta > 0 ? '+' : '') + p.delta + ' \u00b7 ' + esc(p.reason) + ' (' + esc(p.by) + ')</div>').join('');
  $('#sheet').innerHTML = sheetWrap('Edit asset \u00b7 Admin', '<div class="found" style="border-color:var(--line)"><div class="fh">' + ticon(a.detail, true) + '<div style="min-width:0"><div class="fn">' + esc(a.detail) + '</div><div class="ft">' + esc(a.asset) + (a.serial ? ' \u00b7 S/N ' + esc(a.serial) : '') + (a.inv ? ' \u00b7 ' + esc(a.inv) : '') + '</div></div></div></div>' +
    lbl('Status') + '<div class="stg">' + STATUSES.map(s => '<button class="' + (a.status === s ? 'on' : '') + '" onclick="AS.item.status=AS.item.status===\'' + s + '\'?\'\':\'' + s + '\';renderAsset()">' + s + '</button>').join('') + '</div>' +
    lbl('Owner name') + '<input class="input np" id="as-owner" value="' + esc(a.owner) + '">' +
    lbl('Admin note') + '<input class="input np" id="as-note" value="">' +
    '<button class="btn navy full" style="margin-top:12px" onclick="saveAsset()">' + ic('check') + 'Save</button>' +
    lbl('Finds') + (findsHtml || '<div class="small">Not found yet</div>') +
    (pts ? lbl('Points') + '<div class="dz">' + pts + '</div>' : '') +
    lbl('History') + '<div class="dz">' + (AS.history.map(h => '<div class="small">' + fmtAt(h.at) + ' \u00b7 <b>' + esc(h.by) + '</b> \u00b7 ' + esc(h.field) + ' ' + esc(h.old || '\u2014') + ' \u2192 ' + esc(h.nw || '\u2014') + (h.note ? ' (' + esc(h.note) + ')' : '') + '</div>').join('') || '<div class="small">No changes yet</div>') + '</div>');
}
async function saveAsset(){
  try { AS = await call('editAsset', { key:AS.item.asset, status:AS.item.status || '', owner:$('#as-owner').value, note:$('#as-note').value || null }); renderAsset(); toast('Saved', 'check'); FL = null; }
  catch (e){ toast(e.message, 'alert'); }
}
async function saveFindLoc(k){ const f = REG[k]; try { AS = await call('editAsset', { key:AS.item.asset, findId:f.id, location:$('#fl-' + k).value }); renderAsset(); toast('Location saved', 'pin'); FL = null; } catch (e){ toast(e.message, 'alert'); } }
function deduct(k){
  const f = REG[k], box = document.createElement('div'); box.className = 'dz';
  box.innerHTML = lbl('Deduct points from ' + esc(f.by)) + '<div class="row2"><input class="input np" id="dd-pts" type="number" value="' + f.points + '" style="max-width:90px"><input class="input np" id="dd-why" placeholder="Reason \u00b7 e.g. not moved to ASSET ZONE"></div><button class="btn mint full" style="margin-top:8px" onclick="doDeduct(\'' + k + '\')">' + ic('minus') + 'Deduct</button>';
  event.target.closest('.dz').appendChild(box);
}
async function doDeduct(k){
  const f = REG[k], n = Math.abs(Number($('#dd-pts').value) || 0);
  try { await call('adjustPoints', { username:f.by, delta:-n, reason:$('#dd-why').value, ref:f.id }); toast('-' + n + ' ' + f.by, 'minus'); AS = await call('asset', { key:AS.item.asset }); renderAsset(); }
  catch (e){ toast(e.message, 'alert'); }
}
async function resetFind(k){
  const f = REG[k];
  const why = prompt('Reason for reset (the item can be found again):', ''); if (why === null) return;
  const rm = confirm('Also remove the ' + f.points + ' points from ' + f.by + '?');
  try { AS = await call('resetFind', { id:f.id, reason:why, removePoints:rm }); renderAsset(); FL = null; toast('Find reset', 'refresh'); } catch (e){ toast(e.message, 'alert'); }
}
function openAddAsset(pre){
  pre = pre || {};
  $('#sheet').innerHTML = sheetWrap('Add asset to list', lbl('Asset13') + '<input class="input np" id="aa-asset" value="' + esc(pre.asset || '') + '" inputmode="numeric">' + lbl('Serial') + '<input class="input np" id="aa-serial" value="' + esc(pre.serial || '') + '">' +
    lbl('Invent no') + '<input class="input np" id="aa-inv">' + lbl('Detail') + '<input class="input np" id="aa-detail" value="' + esc(pre.detail || '') + '">' + lbl('Owner') + '<input class="input np" id="aa-owner" value="' + esc(pre.owner || '') + '">' +
    '<button class="btn navy full" style="margin-top:12px" onclick="doAddAsset(\'' + esc(pre.fromNew || '') + '\')">' + ic('plus') + 'Add</button>');
  $('#sheet').hidden = false;
}
function addAssetFrom(k){ const x = REG[k]; openAddAsset({ asset:/^\d+$/.test(x.number) ? x.number : '', serial:/^\d+$/.test(x.number) ? '' : x.number, detail:x.detail, owner:x.owner, fromNew:x.id }); }
async function doAddAsset(fromNew){
  const v = id => $('#aa-' + id).value;
  try { await call('addAsset', { asset:v('asset'), serial:v('serial'), inv:v('inv'), detail:v('detail'), owner:v('owner'), fromNew }); $('#sheet').hidden = true; toast('Added', 'check'); } catch (e){ toast(e.message, 'alert'); }
}
async function loadMembers(){ try { MEM = (await call('members')).members; } catch (e){ MEM = []; toast(e.message, 'alert'); } if (ADMT === 'members') renderAdmin(); }
function adminMembers(){
  if (!MEM) return '<div class="count">' + ic('loader', 'spin') + '</div>';
  const pend = MEM.filter(m => m.status === 'pending'), rest = MEM.filter(m => m.status !== 'pending');
  const row = (m, acts) => '<div class="memrow">' + avatar(m, 40) + '<span class="mi"><b>' + esc(m.username) + '</b>' + (m.role === 'admin' ? ' <span class="lv adm">' + ic('shield') + 'Admin</span>' : '') + '<br><span class="small">' + esc(m.email) + '</span><br><span class="tagc">' + esc(m.status) + '</span> <span class="small">' + ic('star') + m.points + '</span></span>' + acts + '</div>';
  const b = (u, ch, icn, label, cls) => '<button class="mbtn ' + (cls || '') + '" onclick="setUser(\'' + esc(u) + '\',' + esc(JSON.stringify(ch)).replace(/"/g, '&quot;') + ')">' + ic(icn) + label + '</button>';
  return '<div class="seg"><button class="' + (MEMT === 'pending' ? 'on' : '') + '" onclick="MEMT=\'pending\';renderAdmin()">' + ic('clock') + 'Waiting' + (pend.length ? ' <span class="cnt">' + pend.length + '</span>' : '') + '</button><button class="' + (MEMT === 'all' ? 'on' : '') + '" onclick="MEMT=\'all\';renderAdmin()">' + ic('users') + 'All</button></div>' +
    (MEMT === 'pending' ? (pend.length ? pend.map(m => row(m, '<span class="macts">' + b(m.username, { status:'active' }, 'check', '', 'ok') + b(m.username, { status:'rejected' }, 'x', '', 'no') + '</span>')).join('') : '<div class="empty">' + mascot('happy') + '<p class="small">No one waiting</p></div>')
      : rest.map(m => row(m, m.username === USER.username ? '' : '<span class="macts col">' + (m.status === 'active' ? b(m.username, { status:'suspended' }, 'lock', 'Suspend') : b(m.username, { status:'active' }, 'check', 'Activate')) +
        (m.role === 'admin' ? b(m.username, { role:'player' }, 'user', 'Make player') : b(m.username, { role:'admin' }, 'shield', 'Make admin')) + '</span>')).join(''));
}
async function setUser(username, ch){
  if (ch.role === 'admin' && !confirm('Make ' + username + ' an admin?')) return;
  try { MEM = (await call('setUser', Object.assign({ username }, ch))).members; ADMD.pendingUsers = MEM.filter(m => m.status === 'pending').length; ADM.pendingUsers = ADMD.pendingUsers; renderNav(); renderAdmin(); toast('Saved', 'userCheck'); }
  catch (e){ toast(e.message, 'alert'); }
}
function adminMore(){
  if (!EX.from){ const d = new Date(), p = n => ('0' + n).slice(-2), iso = x => x.getFullYear() + '-' + p(x.getMonth() + 1) + '-' + p(x.getDate()); EX.to = iso(d); d.setDate(d.getDate() - 30); EX.from = iso(d); }
  return '<h2 class="sec">' + ic('download') + 'Export</h2><div class="card2"><div class="dates"><input type="date" value="' + EX.from + '" onchange="EX.from=this.value"><input type="date" value="' + EX.to + '" onchange="EX.to=this.value"></div>' +
    '<button class="toggle ' + (EX.photos ? 'on' : '') + '" style="margin-top:10px" onclick="EX.photos=!EX.photos;renderAdmin()">' + ic('camera') + 'Include photos<span class="sw"></span></button>' +
    '<button class="btn mint full" style="margin-top:10px" onclick="doExport()" ' + (EX.busy ? 'disabled' : '') + '>' + ic(EX.busy ? 'loader' : 'download', EX.busy ? 'spin' : '') + (EX.busy ? 'Building zip\u2026' : 'Make ZIP (Excel + photos)') + '</button>' +
    (EX.out ? '<div class="dz" style="margin-top:10px">' + EX.out.files.map(f => '<a class="btn ghost full" style="margin-bottom:6px" href="' + esc(f.download) + '" target="_blank" rel="noopener">' + ic('download') + esc(f.name) + ' \u00b7 ' + (f.size / 1048576).toFixed(1) + ' MB</a>').join('') + '<div class="small">' + EX.out.finds + ' finds \u00b7 ' + EX.out.news + ' new items \u00b7 ' + EX.out.photos + ' photos \u00b7 saved in Drive "Radar Quest Exports"</div></div>' : '') + '</div>' +
    '<h2 class="sec">' + ic('pin') + 'Locations</h2>' + LOC.map(l => { const k = keep(l.name); return '<div class="dz"><div class="row2"><input class="input np" id="lc-' + k + '" value="' + esc(l.name) + '"><button class="chip" onclick="locEdit(\'' + k + '\',{name:$(\'#lc-' + k + '\').value})">' + ic('check') + '</button></div><div class="row" style="margin-top:6px">' +
      (l.isNew ? '<span class="newpill">NEW</span><span class="small">by ' + esc(l.by) + '</span><button class="chip sm" onclick="locEdit(\'' + k + '\',{clearNew:true})">OK, not new</button>' : '') + '<button class="chip sm" style="margin-left:auto" onclick="locEdit(\'' + k + '\',{hide:true})">' + ic('x') + 'Hide</button></div></div>'; }).join('') +
    (ADM && ADM.sheetUrl ? '<a class="btn ghost full" style="margin-top:12px" href="' + esc(ADM.sheetUrl) + '" target="_blank" rel="noopener">' + ic('sheet') + 'Open Google Sheet</a>' : '');
}
async function locEdit(k, ch){ try { LOC = (await call('editLocation', Object.assign({ old:REG[k] }, ch))).locations; ADMD.locations = LOC; renderAdmin(); toast('Saved', 'pin'); } catch (e){ toast(e.message, 'alert'); } }
async function doExport(){
  EX.busy = true; EX.out = null; renderAdmin();
  try { EX.out = await call('exportZip', { from:EX.from, to:EX.to, photos:EX.photos }); } catch (e){ toast(e.message, 'alert'); }
  EX.busy = false; if (ADMT === 'more') renderAdmin();
}

/* ================= INIT ================= */
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if (!$('#guide').hidden) closeGuide(); else if (!$('#cel').hidden) $('#cel').hidden = true; else if (!$('#sheet').hidden) $('#sheet').hidden = true; else if (!$('#scan').hidden) closeScan();
});
async function boot(){
  showAuth();
  if (BOOT.reset || BOOT.act || !TOKEN){ renderAuth(); return; }
  $('#auth').innerHTML = '<div class="auth-in"><div class="auth-hero"><h1>Radar Quest</h1><div class="auth-rw"></div></div><div class="auth-card"><div class="waitbox"><div class="wt">' + ic('loader', 'spin') + 'Loading\u2026</div></div></div></div>';
  try { applyBoot(await call('bootstrap')); hideAuth(); render(); maybeGuide(); loadOut(); }
  catch (e){ renderAuth(); if (e.message !== 'AUTH') toast(e.message, 'alert'); }
}
boot();

</script>
</body>
</html>
